# Build with the Quarto bundled in RStudio (1.6.42), from the repo root:
#   /Applications/RStudio.app/Contents/Resources/app/quarto/bin/quarto render
# The quarto on PATH (1.11.9 since Nov 2026) renders the pages slightly differently.
# (A quarto-required pin was tried and dropped: a blocked full render empties docs/ first.)

project:
  type: website
  output-dir: docs

resources:
  - CNAME
  - .well-known/
  - files/apple-touch-icon.png
  - favicon.ico

website:
  title: "Matthew Lavallee"
  site-url: "https://mplavallee.com"
  description: "Matthew Lavallee | PhD Candidate in Health Economics and Policy at Johns Hopkins"
  favicon: files/favicon.png

  open-graph:
    image: https://mplavallee.com/files/headshot.jpg
    description: "Matthew Lavallee | PhD Candidate in Health Economics and Policy at the Johns Hopkins Bloomberg School of Public Health"
  google-analytics: "G-97442ZJR8T"
  twitter-card:
    image: https://mplavallee.com/files/headshot.jpg
  search: false
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research/index.qmd
        text: Research
      - href: teaching/index.qmd
        text: Teaching
      - href: files/cv_lavallee.pdf
        text: CV
    right:
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=5OUEFSUAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: envelope
        href: mailto:mlavall3@jhu.edu
        aria-label: Email

  page-footer:
    left: |
      © 2026 Matthew Lavallee
    right: |
      Made with [Quarto](https://quarto.org/).

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    fontsize: 0.95em
    toc: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="/files/apple-touch-icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">

editor: visual